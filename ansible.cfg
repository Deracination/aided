[defaults]
# Disable host key checking for automated use
host_key_checking = False

# Don't create .retry files
retry_files_enabled = False

# Set reasonable timeouts
timeout = 30
connect_timeout = 30

# Use Python interpreter auto-detection
interpreter_python = auto_silent

# Reduce verbosity of deprecation warnings
deprecation_warnings = False

# Output format
stdout_callback = yaml

# Disable fact gathering by default (we don't need it for AIDE checks)
gathering = explicit

[ssh_connection]
# SSH options for non-interactive use
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# Pipelining for better performance
pipelining = True

[privilege_escalation]
# Default to using sudo
become = False
become_method = sudo
become_ask_pass = False
